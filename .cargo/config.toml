# Baseline lifted to `x86-64-v3` (AVX2 + FMA + BMI2 + LZCNT + MOVBE + F16C).
# This unlocks 256-bit SIMD lanes for `wide` and lets LLVM's auto-vectorizer
# use AVX2 for our scalar loops. v3 covers Intel ≥ Haswell (2013) and AMD
# ≥ Zen (2017) — practically anything still in service. AVX-512 (v4) is
# deliberately not chosen: Alder Lake-N / Raptor Lake-N (e.g. N100) lack it.
# aarch64 is omitted because NEON is mandatory in armv8 and `wide` picks it up
# automatically; no flag needed.

[target.x86_64-unknown-linux-gnu]
# `mold` is a parallel linker — typically 5–10× faster than `ld.bfd`/`gold` on
# Rust incremental builds. Requires gcc ≥ 12 (or clang) for `-fuse-ld=mold`.
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3"]
