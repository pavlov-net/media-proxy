[package]
name = "media-proxy"
version = "1.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "WebSocket-controlled media proxy streaming to LED displays via DDP"
repository = "https://github.com/pavlov-net/media-proxy"
authors = ["Stuart Parmenter"]

[[bin]]
name = "media-proxy"
path = "src/main.rs"

[[bin]]
name = "ddp-view"
path = "src/bin/ddp_view.rs"

[dependencies]
# Runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures = "0.3"
async-trait = "0.1"

# HTTP + WebSocket
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1"
figment = { version = "0.10", features = ["toml", "yaml", "json", "env"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Observability + errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "2"
anyhow = "1"

# Bytes + utilities
bytes = "1.11"
bytemuck = { version = "1.25", features = ["derive"] }
wide = "1"
parking_lot = "0.12"
rand = "0.10"
which = "8"
url = "2.5"
percent-encoding = "2"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
fast_image_resize = { version = "6", features = ["image"] }
lcms2 = { version = "6", features = ["static"] }
infer = { version = "0.22", default-features = false }

gif = "0.14"
gif-dispose = "6"
png = "0.18"
image-webp = "0.2.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1.52", features = ["test-util", "macros"] }
axum-test = "21"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Disables LTO for faster local builds.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"

[profile.dev]
opt-level = 1

# Optimize cached dependencies without slowing incremental application builds.
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
