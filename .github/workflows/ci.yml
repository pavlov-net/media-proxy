name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.98.1"

      - name: Install runtime tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build
        run: cargo build --locked --all-targets

      - name: test
        run: cargo test --locked --all-targets

      - name: smoke test - --help
        run: |
          ./target/debug/media-proxy --help
          ./target/debug/ddp-view --help

      - name: HTTP, WebSocket and DDP streaming smoke test
        run: python3 tests/smoke.py --binary target/debug/media-proxy

      - name: Exercise a real yt-dlp extractor without external network
        run: |
          python3 -m venv /tmp/media-proxy-extractor
          /tmp/media-proxy-extractor/bin/pip install 'yt-dlp[default]==2026.8.19'
          PATH="/tmp/media-proxy-extractor/bin:$PATH" python3 tests/smoke.py --binary target/debug/media-proxy
