name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-drafter:
    name: Release Drafter
    environment: release-drafter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the explicit release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Fail on API errors; only a successful lookup can authorize a new draft.
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/media-proxy-published-tags"
          if grep -Fxq -e "$VERSION" -e "v$VERSION" "$RUNNER_TEMP/media-proxy-published-tags"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        if: steps.version.outputs.published == 'false'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.version.outputs.version }}
