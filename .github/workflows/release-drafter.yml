name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# One run at a time, so a queued run sees the previous run's version-bump commit.
concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  release-drafter:
    name: Release Drafter
    runs-on: ubuntu-latest
    environment: release-drafter
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        id: drafter

      # Install cargo-edit before checkout: it may build from source, and the repo's
      # .cargo/config.toml links with mold, which this runner doesn't have.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-edit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Bump version
        env:
          VERSION: ${{ steps.drafter.outputs.resolved_version }}
        run: cargo set-version "$VERSION"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_DRAFTER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_DRAFTER_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push
        env:
          VERSION: ${{ steps.drafter.outputs.resolved_version }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git -c user.name="pavlov-net-release-drafter[bot]" \
                -c user.email="349057244+pavlov-net-release-drafter[bot]@users.noreply.github.com" \
                commit -m "Bump version to $VERSION [skip ci]"
            # The app token bypasses the default-branch ruleset; hand it to git only for this push.
            git -c credential.helper= -c credential.https://github.com.helper= \
                -c credential.helper='!f() { echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f' push
          fi
