name: Release binaries

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published, released]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Handle prerelease publication and stable promotion without duplicate builds.
    if: github.event_name != 'release' || github.event.action == 'released' || github.event.release.prerelease
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect existing release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          ASSET="media-proxy-${VERSION}-${TARGET}.tar.gz"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          if [ -n "$RELEASE_TAG" ]; then
            test "${RELEASE_TAG#v}" = "$VERSION"
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets"
            ARCHIVE=false
            CHECKSUM=false
            if grep -Fxq "$ASSET" "$RUNNER_TEMP/release-assets"; then ARCHIVE=true; fi
            if grep -Fxq "$ASSET.sha256" "$RUNNER_TEMP/release-assets"; then CHECKSUM=true; fi
            if [ "$ARCHIVE" != "$CHECKSUM" ]; then
              echo "::error::Incomplete release asset pair for $ASSET. Restore or remove the orphaned asset before retrying."
              exit 1
            fi
            if [ "$ARCHIVE" = true ]; then
              gh release download "$RELEASE_TAG" --pattern "$ASSET" --pattern "$ASSET.sha256" --dir dist
              (cd dist && sha256sum -c "$ASSET.sha256")
              mkdir -p "$RUNNER_TEMP/release-binaries"
              tar -xzf "dist/$ASSET" -C "$RUNNER_TEMP/release-binaries" media-proxy ddp-view
              echo "reuse=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.assets.outputs.reuse != 'true'
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: steps.assets.outputs.reuse != 'true'
        run: sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.assets.outputs.reuse != 'true'
        with:
          key: ${{ matrix.target }}
      - name: Build portable static binaries
        if: steps.assets.outputs.reuse != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --bins --target "$TARGET"
      - name: Smoke test and package new binaries
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ steps.assets.outputs.asset }}
          REUSE: ${{ steps.assets.outputs.reuse }}
        run: |
          BIN_DIR="target/$TARGET/release"
          if [ "$REUSE" = true ]; then BIN_DIR="$RUNNER_TEMP/release-binaries"; fi
          "$BIN_DIR/media-proxy" --version
          "$BIN_DIR/ddp-view" --help
          python3 tests/smoke.py --binary "$BIN_DIR/media-proxy"
          if [ "$REUSE" != true ]; then
            tar -czf "dist/$ASSET" -C "$BIN_DIR" media-proxy ddp-view \
              -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY_LICENSES.md README.md
            (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Attach verified binaries and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets"
          mkdir -p "$RUNNER_TEMP/published-assets"
          for FILE in dist/*; do
            ASSET=$(basename "$FILE")
            if grep -Fxq "$ASSET" "$RUNNER_TEMP/release-assets"; then
              gh release download "$RELEASE_TAG" --pattern "$ASSET" --dir "$RUNNER_TEMP/published-assets"
              cmp "$FILE" "$RUNNER_TEMP/published-assets/$ASSET"
            else
              gh release upload "$RELEASE_TAG" "$FILE"
            fi
          done

  notify-addon:
    # Enable only when the add-on consumes standalone release archives.
    if: github.event_name == 'release' && !github.event.release.prerelease && vars.ADDON_RELEASE_DISPATCH_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Notify add-on only after both architectures are available
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: stuartparmenter/media-proxy-addon
          event-type: app-release
          client-payload: '{"version": "${{ github.event.release.tag_name }}"}'
